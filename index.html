<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portefeuille Invest</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Layout: header with masked total, two cards side by side, positions table below */
  :root {
    --bg: #f3f5f2; --fg: #14211c; --muted: #5a6a63; --line: #d5ddd8; --panel: #ffffff; --track: #e3e9e5;
    --c1: #1f6f5c; --c2: #6b8fb8; --c3: #c9a24a; --bar-muted: #b7c4bd;
    --font-display: "Fraunces", Georgia, serif;
    --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1714; --fg: #e8efeb; --muted: #9aaba3; --line: #26332e; --panel: #15201c; --track: #22302b;
      --c1: #5cc2a4; --c2: #8fb2dc; --c3: #e0bd62; --bar-muted: #4a5d55;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 1120px; margin-inline: auto; padding: 40px max(20px, env(safe-area-inset-left, 0px)) 56px; display: grid; gap: 28px; }
  .eyebrow { margin: 0; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .total { margin: 4px 0 6px; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 1.05; letter-spacing: .04em; }
  .take { margin: 0; color: var(--muted); max-width: 60ch; }
  .take b { color: var(--fg); font-weight: 600; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; display: grid; gap: 16px; align-content: start; min-width: 0; }
  .card h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .note { margin: -10px 0 0; font-size: .82rem; color: var(--muted); }
  .cat { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 20px; align-items: center; }
  @media (max-width: 520px) { .cat { grid-template-columns: 1fr; justify-items: center; } }
  .donut { position: relative; width: 100%; max-width: 13rem; aspect-ratio: 1; border-radius: 50%; }
  .donut::after { content: ""; position: absolute; inset: 19%; border-radius: 50%; background: var(--panel); }
  .donut-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; z-index: 1; }
  .donut-label strong { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; line-height: 1; }
  .donut-label span { font-size: .75rem; color: var(--muted); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 400; font-size: .78rem; color: var(--muted); padding: 0 10px 6px 0; white-space: nowrap; }
  td { padding: 10px 10px 10px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .r { text-align: right; padding-right: 0; padding-left: 14px; }
  .big { font-family: var(--font-display); font-size: 1.15rem; }
  .masked { color: var(--muted); letter-spacing: .02em; }
  td.r, #cat-body td:first-child { white-space: nowrap; }
  .total.masked { color: var(--fg); letter-spacing: .04em; }
  .sw { display: inline-block; width: .7rem; height: .7rem; border-radius: 3px; margin-right: .5rem; vertical-align: -.05rem; }
  .bars { display: grid; gap: 12px; }
  .bar-top { display: flex; justify-content: space-between; gap: 10px; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .bar-top span:last-child { color: var(--muted); white-space: nowrap; }
  .track { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; margin-top: 4px; }
  .fill { height: 100%; border-radius: 5px; background: var(--bar-muted); }
  .fill.top { background: var(--c1); }
  .tablewrap { overflow-x: auto; }
  td.muted { color: var(--muted); }
  .chip { display: inline-flex; align-items: center; font-size: .78rem; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .chip .sw { width: .5rem; height: .5rem; margin-right: .4rem; vertical-align: 0; }
  footer { font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Valeur totale du portefeuille · 31 oct. 2026</p>
    <p class="total masked" aria-label="Montant masqué">******* €</p>
  </header>

  <div class="grid">
    <section class="card">
      <h2>Répartition par catégorie</h2>
      <div class="cat">
        <div class="donut" id="donut"><div class="donut-label"><strong id="d-top"></strong><span id="d-top-name"></span></div></div>
        <table>
          <thead><tr><th>Catégorie</th><th class="r">Montant</th><th class="r">Part</th></tr></thead>
          <tbody id="cat-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card">
      <h2>Répartition par type d'enveloppe</h2>
      <p class="note">PEA, compte-titres et assurance vie, tous établissements confondus.</p>
      <div class="bars" id="bars"></div>
    </section>
  </div>

  <section class="card">
    <h2>Positions</h2>
    <p class="note">Supports détenus, un par ligne.</p>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Support</th><th>Type d'enveloppe</th><th>Catégorie</th><th class="r">Montant</th></tr></thead>
        <tbody id="pos-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  // Only percentages are stored here: no amount appears in the page source.
  const MASK = '****** €';
  const CATS = [
    { name: 'Actions', part: 86.0, color: 'var(--c1)' },
    { name: 'Obligations', part: 9.1, color: 'var(--c2)' },
    { name: 'Or & Bitcoin', part: 4.8, color: 'var(--c3)' }
  ];
  const ENVS = [
    ['PEA', 73.9], ['Compte-titres', 17.0], ['Assurance vie', 9.1]
  ];
  const POS = [
    ['ETF MSCI World', 'PEA', 'Actions'],
    ['ETF ACWI', 'Compte-titres', 'Actions'],
    ['ETF Marchés émergents', 'PEA', 'Actions'],
    ['Bitcoin', 'Compte-titres', 'Bitcoin'],
    ['Obligations long terme US', 'Assurance vie', 'Obligations'],
    ['Obligations long terme zone euro', 'Assurance vie', 'Obligations'],
    ['Obligations court terme US', 'Assurance vie', 'Obligations'],
    ['Or physique', 'Compte-titres', 'Or']
  ];
  const pct = v => v.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
  const colorOf = c => (CATS.find(x => x.name === (c === 'Or' || c === 'Bitcoin' ? 'Or & Bitcoin' : c)) || CATS[0]).color;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };


  // Donut (conic gradient)
  let acc = 0;
  const stops = CATS.map(c => { const a = acc; acc += c.part; return `${c.color} ${a}% ${acc}%`; });
  document.getElementById('donut').style.background = `conic-gradient(${stops.join(', ')})`;
  document.getElementById('d-top').textContent = pct(CATS[0].part);
  document.getElementById('d-top-name').textContent = CATS[0].name;

  const cb = document.getElementById('cat-body');
  CATS.forEach(c => {
    const tr = el('tr');
    const td1 = el('td'); const sw = el('span', 'sw'); sw.style.background = c.color; td1.append(sw, c.name);
    tr.append(td1, el('td', 'r masked', MASK), el('td', 'r big', pct(c.part)));
    cb.appendChild(tr);
  });

  const bars = document.getElementById('bars');
  const max = ENVS[0][1];
  ENVS.forEach(([name, p], i) => {
    const b = el('div');
    const top = el('div', 'bar-top'); top.append(el('span', null, name), el('span', null, `${MASK} · ${pct(p)}`));
    const track = el('div', 'track'); const f = el('div', 'fill' + (i === 0 ? ' top' : '')); f.style.width = (p / max * 100) + '%';
    track.appendChild(f); b.append(top, track); bars.appendChild(b);
  });

  const pb = document.getElementById('pos-body');
  POS.forEach(([nom, env, cat]) => {
    const tr = el('tr');
    const c3 = el('td'); const chip = el('span', 'chip'); const sw = el('span', 'sw'); sw.style.background = colorOf(cat); chip.append(sw, cat); c3.appendChild(chip);
    tr.append(el('td', null, nom), el('td', 'muted', env), c3, el('td', 'r masked', MASK));
    pb.appendChild(tr);
  });
</script>
</body>
</html>
